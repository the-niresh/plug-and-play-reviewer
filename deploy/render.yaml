# Render blueprint for the CONTROL PLANE only.
#
# This runs pr-reviewer-api. It never sees your source, your diffs, or your model key:
# those stay on the runner, on your own machine. Do not add a model API key here. There is
# a test that fails if anyone tries.
#
# There is deliberately no `databases:` block. A Render free Postgres is deleted 30 days
# after creation (plus a 14 day grace period) and would take every job record with it.
# Bring your own Neon database instead; its free tier does not expire.
services:
  - type: web
    name: reviewer
    runtime: docker
    # `plan` is not optional here. Leave it out and Render bills you for a 0.5c-512mb
    # instance, which is its default for a new web service.
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    # Migrate, then serve, in one command on purpose. Render's pre-deploy command is a
    # paid feature, so on the free plan the migration has to be part of the start
    # command or it never runs and the service comes up healthy against an empty schema.
    # `exec` hands PID 1 to the API so Render's shutdown signal still reaches it. The
    # migration is idempotent, so a free instance waking from a spin-down just re-checks.
    dockerCommand: /bin/sh -c "/app/.venv/bin/pr-reviewer-db-migrate && exec /app/.venv/bin/pr-reviewer-api"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Postgres connection string. Use the pooled string from your Neon dashboard.
      # The schema needs the pgvector extension, which Neon provides.
      # Without it the service cannot start.
      - key: DATABASE_URL
        sync: false
      # The GitHub App's numeric id. Find it on the App's settings page.
      # Without it every request to the GitHub API is rejected.
      - key: GITHUB_APP_ID
        sync: false
      # The GitHub App's private key (PEM). Generate it on the App's settings
      # page and paste the full text, including the BEGIN and END lines.
      # Without it the service cannot authenticate as the GitHub App.
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      # The GitHub App's OAuth client id, from the App's settings page.
      # Without it users cannot sign in with GitHub.
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      # The GitHub App's OAuth client secret, from the same settings page.
      # Without it users cannot sign in with GitHub.
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      # The GitHub App's webhook secret. Must match the value in the App settings.
      # Without it every webhook is rejected and no review is ever queued.
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # The public https origin this service is reachable at, no trailing slash.
      # Set it once you know the deployed hostname, then redeploy.
      # Without it the OAuth callback and App manifest URLs are wrong.
      - key: PR_REVIEWER_HOSTED_ORIGIN
        sync: false
