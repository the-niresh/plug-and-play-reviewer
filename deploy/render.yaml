services:
  - type: web
    name: reviewer
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/.venv/bin/pr-reviewer-api
    preDeployCommand: /app/.venv/bin/pr-reviewer-db-migrate
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: PR_REVIEWER_HOSTED_ORIGIN
        sync: false
