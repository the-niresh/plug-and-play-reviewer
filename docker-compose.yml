# Pinned so the running stack survives the folder rename to plug-and-play-reviewer.
# Without this, compose derives the project from the directory and a rename would leave
# pr-reviewer-api-1 orphaned while a second stack fought it for the Traefik route.
name: pr-reviewer

services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: pr_reviewer
      POSTGRES_PASSWORD: pr_reviewer
      POSTGRES_DB: pr_reviewer
    volumes:
      - pr_reviewer_postgres:/var/lib/postgresql/data

volumes:
  pr_reviewer_postgres:
