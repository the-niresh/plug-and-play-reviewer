name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: build images
        run: docker compose -f compose.release.yml build
      - name: build release assets
        run: |
          sh scripts/build-local-release.sh dist
      - name: sbom
        run: syft dir:. -o spdx-json > dist/sbom.spdx.json
      - name: container scan
        run: uv run python scripts/check_supply_chain.py containers
      - name: publish github release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pr-reviewer-*-compose.release.yml
            dist/SHA256SUMS
            dist/sbom.spdx.json
          generate_release_notes: true
