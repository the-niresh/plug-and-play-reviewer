name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: oven-sh/setup-bun@v2
      # docker-compose.ci.yml, not a `services:` block. The tests connect to
      # localhost:54329 with the pr_reviewer role, and a services entry cannot express
      # that: it published no port, set no POSTGRES_PASSWORD (so the container exited
      # during init), and had no health gate, so every run reached pytest with nothing
      # listening and died on "connection refused". The compose file already had all
      # three correct and nothing used it. --wait blocks until the healthcheck passes.
      - name: postgres
        run: docker compose -f docker-compose.ci.yml up -d --wait
      # Before the `bun tests` step, because pytest itself shells out to `next build`
      # (the landing and dashboard budget tests measure the real bundle). With no
      # node_modules those runs exited 127, command not found, and the assertion read
      # "next build failed: assert 127 == 0", which names the symptom and not the cause.
      - name: bun install
        run: bun install --frozen-lockfile
        working-directory: apps/web
      - name: lock
        run: uv run python scripts/check_supply_chain.py lock
      - name: ruff
        run: uv run ruff check src tests
      - name: mypy
        run: uv run mypy src
      - name: pytest
        run: flock -w 3600 /tmp/pr-reviewer-pytest.lock uv run pytest -q
      - name: eval regression gate
        run: uv run python -m pr_reviewer.evals.regression_gate
      - name: migration-from-empty
        run: uv run pr-reviewer-db-migrate
      - name: migration-upgrade
        run: uv run pr-reviewer-db-migrate
      - name: bun tests
        run: bun test
        working-directory: apps/web
      - name: frontend build
        run: bun run build
        working-directory: apps/web
      # playwright.config.ts declares a chromium project, and Playwright uses its own
      # pinned browser build rather than whatever Chrome the runner image ships. Without
      # this install the test step cannot launch a browser at all. --with-deps pulls the
      # shared libraries headless chromium needs on a bare ubuntu runner.
      - name: playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: playwright
        run: bunx playwright test
        working-directory: apps/web
      - name: secret scan
        run: uv run python scripts/check_supply_chain.py secrets
      - name: container scan
        run: uv run python scripts/check_supply_chain.py containers
      - name: generated-file check
        run: uv run python scripts/check_supply_chain.py generated
